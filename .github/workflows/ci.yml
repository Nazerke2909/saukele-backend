name: Saukele CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: saukele
          POSTGRES_PASSWORD: saukele_pass
          POSTGRES_DB: saukele_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://saukele:saukele_pass@localhost:5432/saukele_test?schema=public

      - name: Run Prisma migrations
        run: npx prisma db push --force-reset
        env:
          DATABASE_URL: postgresql://saukele:saukele_pass@localhost:5432/saukele_test?schema=public

      - name: Run unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: postgresql://saukele:saukele_pass@localhost:5432/saukele_test?schema=public
          JWT_SECRET: test-jwt-secret-key-min-16-chars
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-min-16
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://saukele:saukele_pass@localhost:5432/saukele_test?schema=public
          JWT_SECRET: test-jwt-secret-key-min-16-chars
          REFRESH_TOKEN_SECRET: test-refresh-secret-key-min-16
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
